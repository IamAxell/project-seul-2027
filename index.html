    <script>
      // Fix for extensions/interceptors attempting to assign to window.fetch when it has only a getter
      (function() {
        try {
          var _origFetch = window.fetch;
          if (_origFetch) {
            var _activeFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _activeFetch;
              },
              set: function(fn) {
                _activeFetch = fn;
              }
            });
          }
        } catch (_) {}

        // Prevent external extension errors from bubbling to app uncaught error listeners
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
